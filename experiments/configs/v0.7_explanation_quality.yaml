experiment:
  name: TrustProtKG v0.7 explanation-quality evaluation
  benchmark_config: configs/real_snapshot_benchmark.yaml
  cross_protein_config: experiments/configs/v0.6_all_leave_one_protein_summary.yaml
  run_cross_protein: true
  random_seed: 42
  timestamp: 2026-06-12T00:00:00Z

quality:
  max_contacts: 5
  source_diversity_cap: 5
  close_contact_distance: 5.0
  supported_contact_distance: 8.0
  min_residue_confidence: 70.0

case_studies:
  variant_ids: V_TP53_R273H,V_BRCA1_M1775R,V_PTEN_C124S

outputs:
  run_dir: experiments/runs/v0.7_explanation_quality
  variant_quality_scores: variant_quality_scores.csv
  quality_by_context: explanation_quality_by_context.csv
  explanation_cards_jsonl: explanation_cards.jsonl
  explanation_cards_markdown: explanation_cards.md
  metadata: metadata.json
  report: explanation_quality_report.md
