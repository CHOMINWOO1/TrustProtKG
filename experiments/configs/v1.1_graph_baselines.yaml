experiment:
  name: TrustProtKG v1.1 graph-aware baseline modeling
  benchmark_config: configs/family_snapshot_benchmark.yaml
  random_seed: 42
  timestamp: 2026-06-12T00:00:00Z

split:
  strategy: all_family_aware
  include_random_split: true
  protein_column: protein_id
  family_column: protein_family
  column: split
  train_value: train
  test_value: test

label:
  column: label_binary

feature_sets:
  transparent_structure_plus_kg: residue_confidence,num_structural_contacts,avg_contact_distance,is_in_domain,num_go_pathway_disease_edges
  graph_pagerank: graph_ppr_residue,graph_ppr_protein,graph_ppr_domain_mass,graph_ppr_go_mass,graph_ppr_pathway_mass,graph_ppr_disease_mass,graph_ppr_biomedical_mass
  graph_metapath: graph_residue_domain_edge_count,graph_residue_contact_domain_count,graph_protein_go_edge_count,graph_protein_pathway_edge_count,graph_protein_disease_edge_count,graph_residue_to_domain_score,graph_residue_to_go_score,graph_residue_to_pathway_score,graph_residue_to_disease_score
  graph_topology: graph_residue_degree,graph_residue_clustering,graph_residue_betweenness,graph_residue_pagerank,graph_protein_degree,graph_protein_pagerank,graph_residue_neighbor_degree_mean,graph_component_size
  graph_all: graph_ppr_residue,graph_ppr_protein,graph_ppr_domain_mass,graph_ppr_go_mass,graph_ppr_pathway_mass,graph_ppr_disease_mass,graph_ppr_biomedical_mass,graph_residue_domain_edge_count,graph_residue_contact_domain_count,graph_protein_go_edge_count,graph_protein_pathway_edge_count,graph_protein_disease_edge_count,graph_residue_to_domain_score,graph_residue_to_go_score,graph_residue_to_pathway_score,graph_residue_to_disease_score,graph_residue_degree,graph_residue_clustering,graph_residue_betweenness,graph_residue_pagerank,graph_protein_degree,graph_protein_pagerank,graph_residue_neighbor_degree_mean,graph_component_size
  transparent_plus_graph: residue_confidence,num_structural_contacts,avg_contact_distance,is_in_domain,num_go_pathway_disease_edges,graph_ppr_residue,graph_ppr_protein,graph_ppr_domain_mass,graph_ppr_go_mass,graph_ppr_pathway_mass,graph_ppr_disease_mass,graph_ppr_biomedical_mass,graph_residue_domain_edge_count,graph_residue_contact_domain_count,graph_protein_go_edge_count,graph_protein_pathway_edge_count,graph_protein_disease_edge_count,graph_residue_to_domain_score,graph_residue_to_go_score,graph_residue_to_pathway_score,graph_residue_to_disease_score,graph_residue_degree,graph_residue_clustering,graph_residue_betweenness,graph_residue_pagerank,graph_protein_degree,graph_protein_pagerank,graph_residue_neighbor_degree_mean,graph_component_size

perturbations:
  names: baseline,remove_structural_contacts,remove_domain_edges,remove_go_edges,remove_pathway_edges,remove_disease_edges,remove_source_db_interpro,weaken_source_db_go
  weaken_confidence_scale: 0.25

comparison:
  transparent_reference_feature_set: transparent_structure_plus_kg

outputs:
  run_dir: experiments/runs/v1.1_graph_baselines
  feature_table: graph_variant_features.csv
  metrics: graph_baseline_metrics.csv
  predictions: graph_baseline_predictions.csv
  graph_vs_transparent: graph_vs_transparent.csv
  perturbation_deltas: graph_perturbation_deltas.csv
  robustness_summary: graph_robustness_summary.csv
  graph_feature_summary: graph_feature_summary.csv
  metadata: metadata.json
  report: graph_baseline_report.md
